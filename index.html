<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yueling2015 的个人主页</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 40px 20px;
            text-align: center;
        }

        .profile {
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--card-bg);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .profile h1 {
            margin-top: 20px;
            font-size: 2.2em;
            font-weight: 600;
            color: var(--text-primary);
        }

        .projects {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .project-info {
            text-align: left;
            flex-grow: 1;
        }

        .project-info h3 {
            margin: 0 0 8px 0;
            font-size: 1.2em;
            color: var(--text-primary);
        }

        .project-info p {
            margin: 0;
            font-size: 0.95em;
            color: var(--text-secondary);
        }

        .go-button {
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: background-color 0.2s ease;
            flex-shrink: 0;
            margin-left: 20px;
        }

        .go-button:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 480px) {
            .project-card {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
            .project-info {
                text-align: center;
            }
            .go-button {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="profile">
            <img src="https://foruda.gitee.com/avatar/1781882554460647713/16604744_yueling-rice_1781882554.png" alt="yueling2015 的头像">
            <h1>yueling2015</h1>
            <h3>邮箱：3236655089@qq.com</h3>
            <h3>QQ:3236655089</h3>
        </header>

        <main class="projects">

                    <p>体验 macOS 12.0 的在线版本</p>
                </div>
                <a href="https://home.yueling.indevs.in/mac-os/" class="go-button" target="_blank">GO</a>
            </div>
            
            <!-- 3. esp开发版控制器在线版 -->

            </div>

            <!-- 4. mc在线版 -->

                </div>
                <a href="https://gitee.com/yueling-rice/Ubuntu-26.04-Mode-For-Windows" class="go-button" target="_blank">GO</a>

            <!-- 4. mc在线版 -->

                <a href="sj.frp.one:62816" class="go-button" target="_blank">GO</a>
            </div>
                
                 <!-- 4. mc在线版 -->

                <div class="project-info">

                </div>
                <a href="https://biliblilvocaloidmythlist.pythonanywhere.com/" class="go-button" target="_blank">GO</a>
            </div>
        </main>
    </div>
</body>
</html>
